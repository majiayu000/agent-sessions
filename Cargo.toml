[package]
name = "agent-sessions"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Read native coding-agent sessions as typed Rust events with source provenance"
license = "MIT"
repository = "https://github.com/majiayu000/agent-sessions"
homepage = "https://github.com/majiayu000/agent-sessions"
documentation = "https://docs.rs/agent-sessions"
readme = "README.md"
keywords = ["claude-code", "codex", "sessions", "jsonl", "parser"]
categories = ["parser-implementations", "development-tools"]
exclude = ["PLAN.md", "fuzz/**", ".github/**", "docs/delivery/**", "docs/research/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
prost-reflect = { version = "0.16", features = ["serde"] }
zstd = "0.13"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
