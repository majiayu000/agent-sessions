[package]
name = "agent-sessions"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded, provenance-preserving Claude Code and Codex session readers"
license = "MIT"
repository = "https://github.com/majiayu000/agent-sessions"
readme = "README.md"
exclude = ["PLAN.md", "fuzz/**", ".github/**", "docs/delivery/**", "docs/research/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
